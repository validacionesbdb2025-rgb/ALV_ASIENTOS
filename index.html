<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Reservas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #111827;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 18px;

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .titulo-asientos {
      font-size: 18px;
      font-weight: bold;
      margin: 25px 0 15px;
    }

    .bus {
      background: #e5e7eb;
      padding: 20px;
      border-radius: 15px;
    }

    .conductor {
      text-align: center;
      background: #374151;
      color: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr 30px 1fr 1fr;
      gap: 8px;

    .pasillo {

      height: 50px;

      background: #2563eb;

    .asiento.ocupado {

    }

    .leyenda {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .cuadro {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }

    .verde {
      background: #22c55e;
    }

    .azul {
      background: #2563eb;
    }

    .rojo {
      background: #ef4444;
    }

    .asiento-elegido {
      margin-top: 15px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .exito {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .container {
        padding: 10px;
        margin: 10px auto;
      }

      .card {
        padding: 15px;
      }

      .fila {
        grid-template-columns: 1fr 1fr 15px 1fr 1fr;
        gap: 5px;
      }

      .pasillo {
        width: 15px;
      }

      .asiento {
        font-size: 12px;
        height: 45px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Reserva tu asiento</h1>

    <div class="subtitulo">
      Completa tus datos y selecciona tu asiento
    </div>

    <form id="formReserva">

      <!-- NOMBRE -->
      <div class="campo">
        <label for="nombre">Nombre completo</label>

        <input
          type="text"
          id="nombre"
          name="NOMBRE"
          placeholder="Escribe tu nombre completo"
          required
        >
      </div>

      <!-- WHATSAPP -->
      <div class="campo">
        <label for="whatsapp">WhatsApp</label>

        <input
          type="tel"
          id="whatsapp"
          name="WHATSAPP"
          placeholder="Ejemplo: 5512345678"
          required
        >
      </div>

      <!-- FECHA -->
      <div class="campo">
        <label for="fecha">Fecha de viaje</label>

        <input
          type="date"
          id="fecha"
          name="FECHA"
          required
        >
      </div>

      <!-- HORA -->
      <div class="campo">
        <label for="hora">Hora de salida</label>

        <input
          type="time"
          id="hora"
          name="HORA"
          required
        >
      </div>

      <!-- ABORDAJE -->
      <div class="campo">
        <label for="abordaje">Lugar de abordaje</label>

        <select
          id="abordaje"
          name="ABORDAJE"
          required
        >

          <option value="">
            Selecciona un punto de abordaje
          </option>

          <option value="Terminal">
            Terminal
          </option>

          <option value="Centro">
            Centro
          </option>

          <option value="Aeropuerto">
            Aeropuerto
          </option>

        </select>
      </div>

      <!-- USUARIO -->
      <div class="campo">
        <label for="usuario">Usuario</label>

        <input
          type="text"
          id="usuario"
          name="USUARIO"
          placeholder="Usuario que realiza la reserva"
          required
        >
      </div>

      <!-- ASIENTOS -->
      <div class="titulo-asientos">
        Selecciona tu asiento
      </div>

      <div class="bus">

        <div class="conductor">
          CONDUCTOR
        </div>

        <!-- FILA 1 -->
        <div class="fila">
          <button type="button" class="asiento" data-asiento="1">1</button>
          <button type="button" class="asiento" data-asiento="2">2</button>

          <div class="pasillo"></div>

          <button type="button" class="asiento" data-asiento="3">3</button>
          <button type="button" class="asiento" data-asiento="4">4</button>
        </div>

        <!-- FILA 2 -->
        <div class="fila">
          <button type="button" class="asiento" data-asiento="5">5</button>
          <button type="button" class="asiento" data-asiento="6">6</button>

          <div class="pasillo"></div>

          <button type="button" class="asiento" data-asiento="7">7</button>
          <button type="button" class="asiento" data-asiento="8">8</button>
        </div>

        <!-- FILA 3 -->
        <div class="fila">
          <button type="button" class="asiento" data-asiento="9">9</button>
          <button type="button" class="asiento" data-asiento="10">10</button>

          <div class="pasillo"></div>

          <button type="button" class="asiento" data-asiento="11">11</button>
          <button type="button" class="asiento" data-asiento="12">12</button>
        </div>

        <!-- FILA 4 -->
        <div class="fila">
          <button type="button" class="asiento" data-asiento="13">13</button>
          <button type="button" class="asiento" data-asiento="14">14</button>

          <div class="pasillo"></div>

          <button type="button" class="asiento" data-asiento="15">15</button>
          <button type="button" class="asiento" data-asiento="16">16</button>
        </div>

        <!-- FILA 5 -->
        <div class="fila">
          <button type="button" class="asiento" data-asiento="17">17</button>
          <button type="button" class="asiento" data-asiento="18">18</button>

          <div class="pasillo"></div>

          <button type="button" class="asiento" data-asiento="19">19</button>
          <button type="button" class="asiento" data-asiento="20">20</button>
        </div>

      </div>

      <!-- LEYENDA -->
      <div class="leyenda">

        <div class="leyenda-item">
          <div class="cuadro verde"></div>
          Disponible
        </div>

        <div class="leyenda-item">
          <div class="cuadro azul"></div>
          Seleccionado
        </div>

        <div class="leyenda-item">
          <div class="cuadro rojo"></div>
          Ocupado
        </div>

      </div>

      <div class="asiento-elegido">
        Asiento seleccionado:
        <span id="asientoSeleccionado">Ninguno</span>
      </div>

      <!-- BOTÓN -->
      <button
        type="submit"
        class="btn"
        id="btnReservar"
      >
        CONFIRMAR RESERVA
      </button>

      <div
        class="loading"
        id="loading"
      >
        Guardando reserva...
      </div>

      <div
        class="mensaje"
        id="mensaje"
      ></div>

    </form>

  </div>

</div>


<script>

  /*
   * =========================================================
   * CONFIGURACIÓN
   * =========================================================
   *
   * Si este HTML está publicado directamente desde Google Apps
   * Script como Web App, NO necesitas colocar ninguna URL.
   *
   * Si lo estás ejecutando fuera de Apps Script, coloca aquí
   * la URL de tu Web App.
   */

  const URL_APPS_SCRIPT = "";


  /*
   * =========================================================
   * VARIABLES
   * =========================================================
   */

  let asientoSeleccionado = null;


  /*
   * =========================================================
   * SELECCIÓN DE ASIENTO
   * =========================================================
   */

  document
    .querySelectorAll(".asiento")
    .forEach(function(asiento) {

      asiento.addEventListener("click", function() {

        // Si está ocupado no se puede seleccionar
        if (asiento.classList.contains("ocupado")) {
          return;
        }

        // Quitar selección anterior
        document
          .querySelectorAll(".asiento")
          .forEach(function(a) {
            a.classList.remove("seleccionado");
          });

        // Seleccionar asiento actual
        asiento.classList.add("seleccionado");

        asientoSeleccionado =
          asiento.getAttribute("data-asiento");

        document
          .getElementById("asientoSeleccionado")
          .textContent = asientoSeleccionado;

      });

    });


  /*
   * =========================================================
   * FORMULARIO
   * =========================================================
   */

  document
    .getElementById("formReserva")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      ocultarMensaje();

      /*
       * Validar asiento
       */

      if (!asientoSeleccionado) {

        mostrarMensaje(
          "Debes seleccionar un asiento.",
          "error"
        );

        return;
      }


      /*
       * Obtener datos
       */

      const nombre =
        document.getElementById("nombre").value.trim();

      const whatsapp =
        document.getElementById("whatsapp").value.trim();

      const fecha =
        document.getElementById("fecha").value;

      const hora =
        document.getElementById("hora").value;

      const abordaje =
        document.getElementById("abordaje").value;

      const usuario =
        document.getElementById("usuario").value.trim();


      /*
       * Validaciones
       */

      if (!nombre) {

        mostrarMensaje(
          "Ingresa el nombre.",
          "error"
        );

        return;
      }


      if (!whatsapp) {

        mostrarMensaje(
          "Ingresa el número de WhatsApp.",
          "error"
        );

        return;
      }


      if (!fecha) {

        mostrarMensaje(
          "Selecciona la fecha.",
          "error"
        );

        return;
      }


      if (!hora) {

        mostrarMensaje(
          "Selecciona la hora.",
          "error"
        );

        return;
      }


      if (!abordaje) {

        mostrarMensaje(
          "Selecciona el lugar de abordaje.",
          "error"
        );

        return;
      }


      if (!usuario) {

        mostrarMensaje(
          "Ingresa el usuario.",
          "error"
        );

        return;
      }


      /*
       * Fecha + hora
       */

      const fechaHora =
        fecha + " " + hora;


      /*
       * ID temporal.
       *
       * El Apps Script debe generar el ID definitivo.
       */

      const datos = {

        FECHA_HORA: fechaHora,

        NOMBRE: nombre,

        WHATSAPP: whatsapp,

        ASIENTO: asientoSeleccionado,

        ESTADO: "RESERVADO",

        USUARIO: usuario,

        ABORDAJE: abordaje

      };


      /*
       * Mostrar cargando
       */

      document
        .getElementById("loading")
        .style.display = "block";

      document
        .getElementById("btnReservar")
        .disabled = true;


      /*
       * ENVIAR A GOOGLE APPS SCRIPT
       */

      enviarReserva(datos);

    });


  /*
   * =========================================================
   * FUNCIÓN PARA ENVIAR RESERVA
   * =========================================================
   */

  function enviarReserva(datos) {

    /*
     * CASO 1:
     * HTML servido directamente por Google Apps Script.
     */

    if (
      typeof google !== "undefined" &&
      google.script &&
      google.script.run
    ) {

      google
        .script
        .run
        .withSuccessHandler(function(respuesta) {

          procesarRespuesta(respuesta);

        })
        .withFailureHandler(function(error) {

          mostrarError(error);

        })
        .guardarReserva(datos);

      return;
    }


    /*
     * CASO 2:
     * HTML externo utilizando URL del Web App.
     */

    if (!URL_APPS_SCRIPT) {

      mostrarMensaje(
        "El HTML no está conectado a Google Apps Script. " +
        "Publica el proyecto como Web App o coloca la URL del Web App.",
        "error"
      );

      finalizarCarga();

      return;
    }


    fetch(URL_APPS_SCRIPT, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(datos)

    })

    .then(function(response) {
      return response.json();
    })

    .then(function(respuesta) {

      procesarRespuesta(respuesta);

    })

    .catch(function(error) {

      mostrarError(error);

    });

  }


  /*
   * =========================================================
   * RESPUESTA DEL SERVIDOR
   * =========================================================
   */

  function procesarRespuesta(respuesta) {

    finalizarCarga();


    if (!respuesta) {

      mostrarMensaje(
        "El servidor no devolvió una respuesta.",
        "error"
      );

      return;
    }


    if (respuesta.success === true) {

      mostrarMensaje(

        "¡Reserva realizada correctamente! " +

        "ID de reserva: " +

        respuesta.idReserva,

        "exito"

      );


      /*
       * Limpiar formulario
       */

      document
        .getElementById("formReserva")
        .reset();


      /*
       * Limpiar asiento
       */

      document
        .querySelectorAll(".asiento")
        .forEach(function(a) {

          a.classList.remove("seleccionado");

        });


      asientoSeleccionado = null;


      document
        .getElementById("asientoSeleccionado")
        .textContent = "Ninguno";


      /*
       * Opcional:
       * marcar el asiento como ocupado
       */

      if (respuesta.asiento) {

        marcarAsientoOcupado(
          respuesta.asiento
        );

      }

      return;
    }


    mostrarMensaje(

      respuesta.message ||
      "No fue posible realizar la reserva.",

      "error"

    );

  }


  /*
   * =========================================================
   * MARCAR ASIENTO OCUPADO
   * =========================================================
   */

  function marcarAsientoOcupado(numero) {

    const asiento =
      document.querySelector(
        '.asiento[data-asiento="' +
        numero +
        '"]'
      );


    if (!asiento) {
      return;
    }


    asiento.classList.remove("seleccionado");

    asiento.classList.add("ocupado");

    asiento.disabled = true;

  }


  /*
   * =========================================================
   * MOSTRAR MENSAJE
   * =========================================================
   */

  function mostrarMensaje(texto, tipo) {

    const mensaje =
      document.getElementById("mensaje");


    mensaje.textContent = texto;

    mensaje.className =
      "mensaje " + tipo;

  }


  /*
   * =========================================================
   * OCULTAR MENSAJE
   * =========================================================
   */

  function ocultarMensaje() {

    const mensaje =
      document.getElementById("mensaje");

    mensaje.textContent = "";

    mensaje.className = "mensaje";

  }


  /*
   * =========================================================
   * MOSTRAR ERROR
   * =========================================================
   */

  function mostrarError(error) {

    finalizarCarga();

    console.error(error);

    mostrarMensaje(

      "Ocurrió un error al guardar la reserva. " +
      "Revisa el Apps Script.",

      "error"

    );

  }


  /*
   * =========================================================
   * FINALIZAR CARGA
   * =========================================================
   */

  function finalizarCarga() {

    document
      .getElementById("loading")
      .style.display = "none";

    document
      .getElementById("btnReservar")
      .disabled = false;

  }


  /*
   * =========================================================
   * FECHA MÍNIMA
   * =========================================================
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const hoy =
        new Date()
          .toISOString()
          .split("T")[0];

      document
        .getElementById("fecha")
        .setAttribute("min", hoy);

    }
  );

</script>

</body>
</html>
